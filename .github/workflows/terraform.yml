name: terraform

on:
  push: {branches: [main]}
  pull_request:

permissions:
  contents: read
  pull-requests: write
  id-token: write          # OIDC to AWS. No stored access keys.

jobs:
  # The secrets context is not available in a job-level `if`, so the presence
  # of AWS credentials is published as an output instead. Without it, plan and
  # apply fail permanently on a public repo that has no AWS account behind it,
  # and a repo whose CI can never be green teaches people to ignore the X.
  credentials:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.AWS_PLAN_ROLE_ARN }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No AWS credentials configured; plan and apply are skipped."
          fi

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: 1.9.8}
      - run: terraform fmt -check -recursive
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --recursive --format compact
      # trivy, not tfsec: tfsec is archived and folded into trivy, and the
      # #trivy:ignore directives in modules/ are only honoured by trivy.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          exit-code: "1"
          severity: CRITICAL,HIGH,MEDIUM
          trivy-config: trivy.yaml

  validate:
    runs-on: ubuntu-latest
    needs: static
    strategy:
      matrix: {env: [staging, prod]}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: 1.9.8}
      # -backend=false so validation needs no credentials and no state lock.
      - run: terraform -chdir=envs/${{ matrix.env }} init -backend=false
      - run: terraform -chdir=envs/${{ matrix.env }} validate

  plan:
    runs-on: ubuntu-latest
    needs: [validate, credentials]
    if: github.event_name == 'pull_request' && needs.credentials.outputs.configured == 'true'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: eu-central-1
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: 1.9.8}
      - run: terraform -chdir=envs/staging init
      - id: plan
        run: terraform -chdir=envs/staging plan -no-color -out=tfplan 2>&1 | tail -c 60000
      - uses: actions/github-script@v7
        with:
          script: |
            const body = `#### staging plan\n\`\`\`\n${{ toJSON(steps.plan.outputs.stdout) }}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  apply:
    runs-on: ubuntu-latest
    needs: [validate, credentials]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.credentials.outputs.configured == 'true'
    # Requires a reviewer on the GitHub environment. Prod never applies
    # unattended, whatever the pipeline would otherwise allow.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: eu-central-1
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: 1.9.8}
      - run: terraform -chdir=envs/prod init
      - run: terraform -chdir=envs/prod apply -auto-approve
